<!DOCTYPE html>
<html>
<head>
<title>Houses Sprite Sheet Analyzer</title>
<style>
body { background: #1a1a2e; color: white; font-family: sans-serif; padding: 20px; }
img { image-rendering: pixelated; }
h2 { color: #38bdf8; margin-top: 20px; }
canvas { image-rendering: pixelated; border: 1px solid #444; display: block; margin-top: 10px; }
.info { margin: 10px 0; font-size: 14px; }
</style>
</head>
<body>
<h1>Houses Sprite Sheet (1536×1024)</h1>
<div class="info" id="info"></div>
<h2>Raw image</h2>
<img id="raw" style="max-width:100%" />
<h2>64px grid overlay</h2>
<canvas id="c64"></canvas>
<h2>128px grid overlay</h2>
<canvas id="c128"></canvas>
<h2>Individual 64px tiles</h2>
<div id="tiles64" style="display:grid;grid-template-columns:repeat(24,64px);gap:1px;margin-top:10px;"></div>
<h2>Individual 128px tiles</h2>
<div id="tiles128" style="display:grid;grid-template-columns:repeat(12,128px);gap:1px;margin-top:10px;"></div>
<script>
const img = new Image();
img.onload = () => {
  document.getElementById('raw').src = img.src;
  document.getElementById('info').textContent = 'Natural size: ' + img.width + '×' + img.height;
  
  // 64px grid
  const c64 = document.getElementById('c64');
  c64.width = img.width; c64.height = img.height;
  const ctx64 = c64.getContext('2d');
  ctx64.imageSmoothingEnabled = false;
  ctx64.drawImage(img, 0, 0);
  ctx64.strokeStyle = 'red'; ctx64.lineWidth = 1;
  for (let x = 0; x <= img.width; x += 64) { ctx64.beginPath(); ctx64.moveTo(x+.5, 0); ctx64.lineTo(x+.5, img.height); ctx64.stroke(); }
  for (let y = 0; y <= img.height; y += 64) { ctx64.beginPath(); ctx64.moveTo(0, y+.5); ctx64.lineTo(img.width, y+.5); ctx64.stroke(); }
  
  // 128px grid
  const c128 = document.getElementById('c128');
  c128.width = img.width; c128.height = img.height;
  const ctx128 = c128.getContext('2d');
  ctx128.imageSmoothingEnabled = false;
  ctx128.drawImage(img, 0, 0);
  ctx128.strokeStyle = 'cyan'; ctx128.lineWidth = 2;
  for (let x = 0; x <= img.width; x += 128) { ctx128.beginPath(); ctx128.moveTo(x+1, 0); ctx128.lineTo(x+1, img.height); ctx128.stroke(); }
  for (let y = 0; y <= img.height; y += 128) { ctx128.beginPath(); ctx128.moveTo(0, y+1); ctx128.lineTo(img.width, y+1); ctx128.stroke(); }
  
  // Individual 64px tiles
  const t64 = document.getElementById('tiles64');
  for (let r = 0; r < 16; r++) {
    for (let c = 0; c < 24; c++) {
      const cv = document.createElement('canvas');
      cv.width = 64; cv.height = 64;
      const cx = cv.getContext('2d');
      cx.imageSmoothingEnabled = false;
      cx.drawImage(img, c*64, r*64, 64, 64, 0, 0, 64, 64);
      const label = document.createElement('div');
      label.style.cssText = 'position:relative;';
      cv.style.cssText = 'width:64px;height:64px;image-rendering:pixelated;border:1px solid #333;';
      const txt = document.createElement('div');
      txt.style.cssText = 'font-size:8px;color:#aaa;text-align:center;';
      txt.textContent = c + ',' + r;
      label.appendChild(cv);
      label.appendChild(txt);
      t64.appendChild(label);
    }
  }
  
  // Individual 128px tiles
  const t128 = document.getElementById('tiles128');
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 12; c++) {
      const cv = document.createElement('canvas');
      cv.width = 128; cv.height = 128;
      const cx = cv.getContext('2d');
      cx.imageSmoothingEnabled = false;
      cx.drawImage(img, c*128, r*128, 128, 128, 0, 0, 128, 128);
      const label = document.createElement('div');
      label.style.cssText = 'position:relative;';
      cv.style.cssText = 'width:128px;height:128px;image-rendering:pixelated;border:1px solid #333;';
      const txt = document.createElement('div');
      txt.style.cssText = 'font-size:9px;color:#aaa;text-align:center;';
      txt.textContent = c + ',' + r;
      label.appendChild(cv);
      label.appendChild(txt);
      t128.appendChild(label);
    }
  }
};
img.src = '/houses.png';
</script>
</body>
</html>
